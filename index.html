<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>哈雷 2061</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: full-bleed canvas orrery (sun-centred, ecliptic seen from north, radial sqrt-ish compression);
   countdown pinned top-left, live readout bottom-left, controls bottom-right. Single dark look by design. */
:root{
  --void:#05080f;        /* deep space */
  --ink:#dfe7f2;         /* primary text */
  --dim:#7f8ca3;         /* secondary text, faint blue-grey */
  --orbit:#2a3650;       /* planetary orbits */
  --ice:#a9e4ff;         /* Halley: icy blue-white */
  --sol:#ffcf7a;         /* the Sun */
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block;}

.clock{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + clamp(16px,3.5vw,44px));
  left:max(16px,calc(env(safe-area-inset-left,0px) + clamp(16px,3.5vw,48px)));
  display:grid;gap:6px;pointer-events:none;max-width:calc(100% - 32px);
}
.eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ice);opacity:.85;}
.days{display:flex;align-items:baseline;gap:10px;line-height:.9;}
.days b{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,9vw,128px);letter-spacing:.01em;font-variant-numeric:tabular-nums;}
.days span{font-size:clamp(16px,1.8vw,22px);color:var(--dim);}
.hms{font-family:var(--f-display);font-weight:300;font-size:clamp(30px,4.4vw,60px);letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1;}
.hms i{font-style:normal;color:var(--dim);margin:0 .08em;}
.sub{font-size:13px;color:var(--dim);margin-top:4px;}
.sub em{font-style:normal;color:var(--ink);font-family:var(--f-data);}
.sim{display:inline-block;margin-left:8px;padding:1px 7px;border:1px solid var(--sol);color:var(--sol);border-radius:3px;font-size:11px;letter-spacing:.08em;}

.readout{
  position:fixed;
  bottom:calc(env(safe-area-inset-bottom,0px) + clamp(16px,3vw,36px));
  left:max(16px,calc(env(safe-area-inset-left,0px) + clamp(16px,3.5vw,48px)));
  display:grid;grid-template-columns:auto auto;gap:4px 16px;
  font-family:var(--f-data);font-size:12px;color:var(--dim);pointer-events:none;
}
.readout dt{letter-spacing:.04em;}
.readout dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;}
.readout .when{grid-column:1/-1;color:var(--ink);margin-bottom:4px;font-size:13px;}

.controls{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;
  pointer-events:auto;opacity:.45;transition:opacity .3s;
}
.controls:hover,.controls:focus-within{opacity:1;}
.controls button{
  font:500 12px var(--f-body);color:var(--ink);background:rgba(5,8,15,.6);
  border:1px solid var(--orbit);border-radius:4px;padding:6px 11px;cursor:pointer;
}
.controls button[aria-pressed="true"]{border-color:var(--ice);color:var(--ice);}
.controls button:focus-visible{outline:2px solid var(--ice);outline-offset:2px;}

@media (max-width:520px){
  .readout{font-size:11px;grid-template-columns:auto auto;}
  .readout .opt{display:none;}
}
</style>
</head>
<body>

<canvas id="sky" aria-label="太陽系與哈雷彗星此刻的位置"></canvas>

<div class="clock" aria-live="off">
  <div class="eyebrow">1P/Halley · 下一次近日點</div>
  <div class="days"><b id="cd-days">—</b><span>天</span></div>
  <div class="hms" id="cd-hms">00<i>:</i>00<i>:</i>00</div>
  <div class="sub"><span id="cd-date">2061 年 7 月 28 日</span> · 約 <em id="cd-yrs">—</em> 年後<span class="sim" id="sim-chip" hidden>模擬時間</span></div>
  <div class="controls">
    <button id="b-rate" type="button" aria-pressed="false">即時</button>
    <button id="b-fs" type="button">全螢幕</button>
  </div>
</div>

<dl class="readout">
  <div class="when" id="ro-when">—</div>
  <dt>距太陽</dt><dd id="ro-rs">—</dd>
  <dt>距地球</dt><dd id="ro-re">—</dd>
  <dt>軌道速度</dt><dd id="ro-v">—</dd>
  <dt class="opt">光行時間（彗星→地球）</dt><dd class="opt" id="ro-lt">—</dd>
</dl>


<script>
/*MATH*/
const D2R = Math.PI/180;
const jdOf = ms => ms/86400000 + 2440587.5;
const msOf = jd => (jd - 2440587.5)*86400000;

// JPL approximate Keplerian elements (Standish), J2000 ecliptic: [a, e, I, L, varpi, Omega] + rates per century
const PLANETS = [
  {n:"水星", c:"#b9b2a8", s:2.2, el:[0.38709927,0.20563593,7.00497902,252.25032350,77.45779628,48.33076593], r:[0.00000037,0.00001906,-0.00594749,149472.67411175,0.16047689,-0.12534081]},
  {n:"金星", c:"#f1d9a6", s:3.0, el:[0.72333566,0.00677672,3.39467605,181.97909950,131.60246718,76.67984255], r:[0.00000390,-0.00004107,-0.00078890,58517.81538729,0.00268329,-0.27769418]},
  {n:"地球", c:"#6fb7ff", s:3.3, el:[1.00000261,0.01671123,-0.00001531,100.46457166,102.93768193,0], r:[0.00000562,-0.00004392,-0.01294668,35999.37244981,0.32327364,0]},
  {n:"火星", c:"#e2774f", s:2.7, el:[1.52371034,0.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891], r:[0.00001847,0.00007882,-0.00813131,19140.30268499,0.44441088,-0.29257343]},
  {n:"木星", c:"#d9b48c", s:6.0, el:[5.20288700,0.04838624,1.30439695,34.39644051,14.72847983,100.47390909], r:[-0.00011607,-0.00013253,-0.00183714,3034.74612775,0.21252668,0.20469106]},
  {n:"土星", c:"#e7d39a", s:5.0, ring:true, el:[9.53667594,0.05386179,2.48599187,49.95424423,92.59887831,113.66242448], r:[-0.00125060,-0.00050991,0.00193609,1222.49362201,-0.41897216,-0.28867794]},
  {n:"天王星", c:"#9fe3e6", s:4.0, el:[19.18916464,0.04725744,0.77263783,313.23810451,170.95427630,74.01692503], r:[-0.00196176,-0.00004397,-0.00242939,428.48202785,0.40805281,0.04240589]},
  {n:"海王星", c:"#5c86ff", s:4.0, el:[30.06992276,0.00859048,1.77004347,-55.12002969,44.96476227,131.78422574], r:[0.00026291,0.00005105,0.00035372,218.45945325,-0.32241464,-0.00508664]},
];

function kepler(M, e){
  M = ((M + Math.PI) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI) - Math.PI;
  let E = e < 0.8 ? M : Math.PI*Math.sign(M || 1);
  for (let k=0;k<40;k++){ const d=(E - e*Math.sin(E) - M)/(1 - e*Math.cos(E)); E-=d; if (Math.abs(d)<1e-12) break; }
  return E;
}
// orbital-plane (x',y') -> ecliptic xyz
function rotate(xp, yp, w, O, I){
  const cw=Math.cos(w), sw=Math.sin(w), cO=Math.cos(O), sO=Math.sin(O), cI=Math.cos(I), sI=Math.sin(I);
  return [
    (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp,
    (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp,
    (sw*sI)*xp + (cw*sI)*yp
  ];
}
function planetElems(p, jd){
  const T=(jd-2451545)/36525, v=p.el.map((x,i)=>x+p.r[i]*T);
  return {a:v[0], e:v[1], I:v[2]*D2R, w:(v[4]-v[5])*D2R, O:v[5]*D2R, M:(v[3]-v[4])*D2R};
}
function posFromE(o, E){
  const xp=o.a*(Math.cos(E)-o.e), yp=o.a*Math.sqrt(1-o.e*o.e)*Math.sin(E);
  return rotate(xp, yp, o.w, o.O, o.I);
}
function planetPos(p, jd){ const o=planetElems(p,jd); return posFromE(o, kepler(o.M,o.e)); }

// 1P/Halley — osculating elements from the 1986 apparition (J2000 ecliptic)
const T_PERI_1986 = 2446470.96;                 // 1986 Feb 9.46
const T_PERI_2061 = jdOf(Date.UTC(2061,6,28));  // 2061 Jul 28
const H_P = T_PERI_2061 - T_PERI_1986;          // period used for propagation (days)
const HALLEY = {q:0.58710, e:0.96714, I:162.26*D2R, w:111.33*D2R, O:58.42*D2R};
HALLEY.a = HALLEY.q/(1-HALLEY.e);
const halleyM = jd => 2*Math.PI*(jd - T_PERI_1986)/H_P;
const halleyPos = jd => posFromE(HALLEY, kepler(halleyM(jd), HALLEY.e));
const nextPerihelion = jd => T_PERI_1986 + Math.max(1, Math.ceil((jd - T_PERI_1986)/H_P))*H_P;
const lastPerihelion = jd => nextPerihelion(jd) - H_P;
const visViva = (r,a) => 29.7847*Math.sqrt(2/r - 1/a); // km/s
/*ENDMATH*/

// ---------- drawing ----------
const cv=document.getElementById("sky"), ctx=cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const R_MAX = HALLEY.a*(1+HALLEY.e) + 0.5;
const PWR = 0.45;
const comp = (x,y) => { const r=Math.hypot(x,y); if(r===0) return [0,0]; const s=Math.pow(r/R_MAX,PWR)/r; return [x*s, y*s]; };

// unit-space orbit samples (computed once)
const nowJD0 = jdOf(Date.now());
const planetOrbits = PLANETS.map(p => { const o=planetElems(p,nowJD0); const pts=[]; for(let k=0;k<=360;k++){ const P=posFromE(o, k/360*2*Math.PI); pts.push(comp(P[0],P[1])); } return pts; });
const halleyOrbit = []; for(let k=0;k<=1440;k++){ const P=posFromE(HALLEY, -Math.PI + k/1440*2*Math.PI); halleyOrbit.push(comp(P[0],P[1])); }

let W=0,H=0,DPR=1,scale=1,cx=0,cy=0,stars=[];
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const pts of [halleyOrbit, planetOrbits[7]]) for(const [x,y] of pts){ x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,-y);y1=Math.max(y1,-y); }
  scale=Math.min(W*0.9/(x1-x0), H*0.86/(y1-y0));
  cx=W/2 - scale*(x0+x1)/2; cy=H/2 - scale*(y0+y1)/2;
  const n=Math.round(W*H/2600); stars=[];
  for(let i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()<0.92?Math.random()*0.8+0.2:Math.random()*1.3+0.7,a:Math.random()*0.6+0.15,t:Math.random()*6.28,s:0.3+Math.random()*1.2});
}
const S = ([x,y]) => [cx + x*scale, cy - y*scale];
const toScreen = (P) => S(comp(P[0],P[1]));

function path(pts){ ctx.beginPath(); pts.forEach((p,i)=>{ const [X,Y]=S(p); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }); }
function label(txt,x,y,color,dx=8,dy=-8,font="500 12px "){
  ctx.font=font+getComputedStyle(document.documentElement).getPropertyValue("--f-body");
  ctx.fillStyle=color; ctx.fillText(txt,x+dx,y+dy);
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = {orbit:css("--orbit"), ice:css("--ice"), dim:css("--dim"), sol:css("--sol"), ink:css("--ink")};
const fmtYM = jd => { const d=new Date(msOf(jd)); return `${d.getUTCFullYear()}.${String(d.getUTCMonth()+1).padStart(2,"0")}`; };

function draw(jd, t){
  ctx.fillStyle=css("--void"); ctx.fillRect(0,0,W,H);
  for(const s of stars){ const tw=reduce?1:0.75+0.25*Math.sin(t*0.001*s.s+s.t); ctx.globalAlpha=s.a*tw; ctx.fillStyle="#cfd8ea"; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill(); }
  ctx.globalAlpha=1;

  // vernal equinox direction
  const [sx,sy]=S([0,0]);
  ctx.strokeStyle=C.orbit; ctx.setLineDash([2,6]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(W-24,sy); ctx.stroke(); ctx.setLineDash([]);
  ctx.font="11px "+css("--f-data"); ctx.fillStyle=C.dim; ctx.textAlign="right"; ctx.fillText("♈ 春分點方向",W-24,sy-6); ctx.textAlign="left";

  // planetary orbits
  ctx.lineWidth=1; ctx.strokeStyle=C.orbit;
  planetOrbits.forEach(pts=>{ path(pts); ctx.stroke(); });

  // Halley orbit: full faint, travelled since last perihelion bright, remaining dashed
  ctx.strokeStyle="rgba(169,228,255,.16)"; path(halleyOrbit); ctx.stroke();
  const t0=lastPerihelion(jd), t1=t0+H_P, seg=(a,b,n)=>{ const pts=[]; for(let k=0;k<=n;k++){ const P=halleyPos(a+(b-a)*k/n); pts.push(comp(P[0],P[1])); } return pts; };
  ctx.strokeStyle="rgba(169,228,255,.55)"; ctx.lineWidth=1.2; path(seg(t0,jd,600)); ctx.stroke();
  ctx.setLineDash([3,5]); ctx.strokeStyle="rgba(169,228,255,.32)"; path(seg(jd,t1,600)); ctx.stroke(); ctx.setLineDash([]);

  // Halley milestones
  const mark=(tj,txt,dx,dy)=>{ const [X,Y]=toScreen(halleyPos(tj)); ctx.fillStyle=C.ice; ctx.beginPath(); ctx.arc(X,Y,2,0,6.283); ctx.fill(); ctx.font="11px "+css("--f-data"); ctx.fillStyle=C.dim; ctx.fillText(txt,X+dx,Y+dy); };
  mark(t0+H_P/2, `遠日點 ${fmtYM(t0+H_P/2)} · ${(HALLEY.a*(1+HALLEY.e)).toFixed(1)} AU`, 8, 16);

  // Sun
  const g=ctx.createRadialGradient(sx,sy,0,sx,sy,26); g.addColorStop(0,"rgba(255,236,190,1)"); g.addColorStop(.25,"rgba(255,207,122,.75)"); g.addColorStop(1,"rgba(255,180,80,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,26,0,6.283); ctx.fill();
  ctx.fillStyle="#fff4d6"; ctx.beginPath(); ctx.arc(sx,sy,4.5,0,6.283); ctx.fill();

  // planets
  let earth=null;
  PLANETS.forEach(p=>{
    const P=planetPos(p,jd); if(p.n==="地球") earth=P;
    const [X,Y]=toScreen(P);
    if(p.ring){ ctx.strokeStyle="rgba(231,211,154,.7)"; ctx.lineWidth=1; ctx.beginPath(); ctx.ellipse(X,Y,p.s*2,p.s*0.7,-0.4,0,6.283); ctx.stroke(); }
    ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(X,Y,p.s,0,6.283); ctx.fill();
    const big=p.s>=4;
    label(p.n,X,Y,big?C.ink:C.dim,p.s+5,-p.s-3, big?"500 12px ":"400 11px ");
  });

  // Halley + tail (anti-sunward, length grows as it nears the Sun)
  const HP=halleyPos(jd), r=Math.hypot(...HP), [hx,hy]=toScreen(HP);
  const ux=(hx-sx)/(Math.hypot(hx-sx,hy-sy)||1), uy=(hy-sy)/(Math.hypot(hx-sx,hy-sy)||1);
  const L=Math.min(170, Math.max(10, 260/Math.pow(r,1.1)));
  const tg=ctx.createLinearGradient(hx,hy,hx+ux*L,hy+uy*L); tg.addColorStop(0,"rgba(169,228,255,.7)"); tg.addColorStop(1,"rgba(169,228,255,0)");
  ctx.strokeStyle=tg; ctx.lineCap="round";
  for(const [w,off] of [[3,0],[1.4,0.12],[1.4,-0.12]]){ ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+(ux*Math.cos(off)-uy*Math.sin(off))*L, hy+(ux*Math.sin(off)+uy*Math.cos(off))*L); ctx.stroke(); }
  const pulse = reduce?0:Math.sin(t*0.002)*1.5;
  const hg=ctx.createRadialGradient(hx,hy,0,hx,hy,14+pulse); hg.addColorStop(0,"rgba(220,245,255,.95)"); hg.addColorStop(1,"rgba(169,228,255,0)");
  ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(hx,hy,14+pulse,0,6.283); ctx.fill();
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(hx,hy,2.4,0,6.283); ctx.fill();
  const left = ux>0.3; ctx.textAlign=left?"right":"left";
  ctx.font="500 13px "+css("--f-body"); ctx.fillStyle=C.ice; ctx.fillText("哈雷彗星", hx+(left?-14:14), hy-10);
  ctx.font="11px "+css("--f-data"); ctx.fillStyle=C.dim; ctx.fillText(`1P/Halley · ${r.toFixed(2)} AU`, hx+(left?-14:14), hy+6);
  ctx.textAlign="left";

  // scale note
  ctx.font="10px "+css("--f-data"); ctx.fillStyle=C.dim; ctx.globalAlpha=.7;
  ctx.textAlign="right"; ctx.fillText("俯視黃道面 · 距離經 r^0.45 壓縮", W-24, sy+16); ctx.textAlign="left"; ctx.globalAlpha=1;
  return {HP, r, earth};
}

// ---------- HUD ----------
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const nf=new Intl.NumberFormat("zh-TW");
let lastHud=0;
function hud(jd, info){
  const next=nextPerihelion(jd), dMs=Math.max(0,msOf(next)-msOf(jd)), s=Math.floor(dMs/1000);
  $("cd-days").textContent=nf.format(Math.floor(s/86400));
  $("cd-hms").innerHTML=`${pad(Math.floor(s%86400/3600))}<i>:</i>${pad(Math.floor(s%3600/60))}<i>:</i>${pad(s%60)}`;
  const nd=new Date(msOf(next)); $("cd-date").textContent=`${nd.getUTCFullYear()} 年 ${nd.getUTCMonth()+1} 月 ${nd.getUTCDate()} 日`;
  $("cd-yrs").textContent=(dMs/86400000/365.25).toFixed(2);
  const now=new Date(msOf(jd));
  $("ro-when").textContent=now.toLocaleString("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  const {HP,r,earth}=info, re=Math.hypot(HP[0]-earth[0],HP[1]-earth[1],HP[2]-earth[2]);
  $("ro-rs").textContent=`${r.toFixed(3)} AU`;
  $("ro-re").textContent=`${re.toFixed(3)} AU`;
  $("ro-v").textContent=`${visViva(r,HALLEY.a).toFixed(3)} km/s`;
  const lt=re*499.004784/3600; $("ro-lt").textContent=`${Math.floor(lt)} 時 ${pad(Math.round(lt%1*60))} 分`;
}

// ---------- time control ----------
const RATES=[{n:"即時",d:0},{n:"快轉 · 1 秒＝1 個月",d:30.44},{n:"快轉 · 1 秒＝1 年",d:365.25}];
let rateIx=0, simJD=null, lastT=null;
$("b-rate").addEventListener("click",()=>{
  rateIx=(rateIx+1)%RATES.length; const r=RATES[rateIx];
  $("b-rate").textContent=r.n; $("b-rate").setAttribute("aria-pressed", r.d?"true":"false");
  if(r.d===0) simJD=null; else if(simJD===null) simJD=jdOf(Date.now());
  $("sim-chip").hidden = r.d===0;
});
$("b-fs").addEventListener("click",()=>{
  try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
});

function frame(t){
  const dt = lastT===null?0:(t-lastT)/1000; lastT=t;
  if(simJD!==null) simJD += RATES[rateIx].d*dt;
  const jd = simJD ?? jdOf(Date.now());
  const info=draw(jd,t);
  if(t-lastHud>200 || simJD!==null){ hud(jd,info); lastHud=t; }
  requestAnimationFrame(frame);
}
addEventListener("resize",layout);
layout();
try{ navigator.wakeLock?.request("screen").catch(()=>{}); }catch(e){}
requestAnimationFrame(frame);
</script>
</body>
</html>
